[package]
name = "listen-visualizer"
description = "Spectrum analyzer for Listen: captures Listen's own audio stream and computes audioMotion-style bands"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rustfft = "6.4"
tokio.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[target.'cfg(windows)'.dependencies]
cpal = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
listen-core.workspace = true
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSString", "NSValue", "NSUUID", "NSObject"] }
